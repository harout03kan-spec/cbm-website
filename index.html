    <!-- Social Meta Tags -->
    <meta property="og:site_name" content="Canada BTC Miners" />
    <meta property="og:title" content="Canada BTC Miners | ASIC Miner Sales, Repair & Bulk Deals in Canada" />
    <meta property="og:description" content="Canada BTC Miners sells new and used ASIC miners, provides ASIC miner repair from Montreal, supports bulk miner deals, and helps with hosting inquiries across Canada." />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  </head>
  <body>
    <!--
      Netlify Forms detection form (hidden). Netlify scans built HTML at deploy
      time and registers this "contact" form. The React contact page submits the
      same field names via fetch. The "subject" field becomes the notification
      email subject (so the Gmail "[Website Lead]" filter labels it). Set the
      notification recipient to info@canadabtcminers.ca in the Netlify dashboard.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="company" />
      <input type="text" name="inquiry" />
      <textarea name="message"></textarea>
      <input type="text" name="subject" />
      <input type="text" name="page_source" />
      <input type="text" name="submitted_at" />
      <input type="text" name="bot-field" />
    </form>
    <!-- Netlify Forms detection form (hidden) for the homepage promo-code signup. -->
    <form name="discount-signup" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="promo_code" />
      <input type="text" name="language" />
      <input type="text" name="page_source" />
      <input type="text" name="submitted_at" />
      <input type="text" name="subject" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
